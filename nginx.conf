server {
    listen       80;
    listen  [::]:80;
    server_name  _;

    root   /usr/share/nginx/html;
    index  index.html;

    # (mime.types — including font/otf — is already included at the http level
    #  by the base image's nginx.conf, so we don't re-declare types here)

    # gzip text assets
    gzip on;
    gzip_vary on;
    gzip_min_length 256;
    gzip_types text/plain text/css application/javascript application/json
               image/svg+xml font/otf application/xml;

    # clean URLs: /contact -> contact.html, and serve real files/dirs first
    location / {
        try_files $uri $uri/ $uri.html =404;
    }

    # long cache for versioned/static assets
    location ~* \.(?:css|js|png|jpe?g|gif|svg|ico|otf|ttf|woff2?|pdf|webp|avif)$ {
        expires 30d;
        add_header Cache-Control "public, max-age=2592000";
        access_log off;
    }

    # don't cache HTML so redeploys show immediately
    location ~* \.html$ {
        add_header Cache-Control "no-cache";
    }

    error_page 404 /index.html;
}
